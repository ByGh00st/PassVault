[package]
name = "passvault"
version = "1.0.0"
description = "PassVault++ Omega Sovereign Cryptographic Core"
authors = ["ByGhost"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "path-all", "fs-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.21"
anyhow = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security_Cryptography"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
